<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
    <meta content="light dark" name="color-scheme"/>
    <!-- Harbor `bg` token, light and dark (docs/design/design-system.md) -->
    <meta content="#E8ECEF" media="(prefers-color-scheme: light)" name="theme-color"/>
    <meta content="#161D24" media="(prefers-color-scheme: dark)" name="theme-color"/>
    <meta content="yes" name="apple-mobile-web-app-capable"/>
    <meta content="default" name="apple-mobile-web-app-status-bar-style"/>
    <meta content="Stock Insights" name="apple-mobile-web-app-title"/>
    <meta content="yes" name="mobile-web-app-capable"/>
    <meta content="telephone=no" name="format-detection"/>

    <title>Stock Insights</title>
    <link href="./manifest.webmanifest" rel="manifest"/>
    <link href="./icons/icon-192.png" rel="icon" sizes="192x192" type="image/png"/>
    <link href="./icons/icon-192.png" rel="apple-touch-icon"/>
    <!-- System fonts only: no web-font round trip, works offline. -->
    <link href="./styles.css" rel="stylesheet"/>
</head>
<body>
<noscript>
    <p class="noscript">Stock Insights needs JavaScript turned on.</p>
</noscript>
<script src="./js/app.js" type="module"></script>

</html>
